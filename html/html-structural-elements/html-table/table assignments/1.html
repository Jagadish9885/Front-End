<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Assignment 1</title>
    <style>
        table, th, td{
            border: 1px solid black;
            border-collapse: collapse;
        }
      
    </style>
</head>
<body>
    <table>
        <caption>DETAILS</caption>
        <thead>
            <tr>
                <th>FirstName</th>
                <th>LastName</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Sharma</td>
                <td>Priya</td>
                <td>24</td>
            </tr>
            <tr>
                <td>Arun</td>
                <td>Sing</td>
                <td>32</td>
            </tr>
            <tr>
                <td>Sam</td>
                <td>Watson</td>
                <td>41</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
