<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Image Example</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-image: url(https://www.shutterstock.com/shutterstock/photos/173166449/display_1500/stock-photo-jaguar-attacking-out-of-white-background-173166449.jpg); /* Replace with your image path */
      background-size: cover; /* Ensures the image covers the entire screen */
      background-position: center; /* Centers the image */
      background-repeat: no-repeat; /* Prevents tiling */
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    h1 {
      background: rgba(0, 0, 0, 0.5); /* Adds a semi-transparent background for readability */
      padding: 20px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>Welcome to My Webpage</h1>
</body>
</html>
